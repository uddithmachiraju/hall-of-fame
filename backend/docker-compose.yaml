services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hof-backend
    command:
      python -m src.main
    expose:
      - 8000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 8.0

  nginx:
    image: nginx:latest
    container_name: hof-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

