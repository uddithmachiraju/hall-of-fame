services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hof-backend
    command:
      python -m src.main
    expose:
      - 8000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 8.0
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: hof-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: hof-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  redis_data:
